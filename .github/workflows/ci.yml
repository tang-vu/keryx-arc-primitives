name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global npm@11.19.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:package
